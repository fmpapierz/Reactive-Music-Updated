org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# Mod metadata
# ---------------------------------------------------------------------------
mod_id=reactivemusic
mod_name=Reactive Music
mod_version=1.4.0
mod_group=circuitlord.reactivemusic
mod_license=GPL-3.0-only
mod_authors=hooneybAdgers
mod_credits=Based on Reactive Music by CircuitLord
mod_original_author=CircuitLord
mod_description=Refactors Minecraft's music to be dynamic and reactive, including new fantasy and celtic tracks to give an air of adventure.
mod_homepage=https://github.com/fmpapierz/Reactive-Music-Updated
mod_issues=https://github.com/fmpapierz/Reactive-Music-Updated/issues
mod_sources=https://github.com/fmpapierz/Reactive-Music-Updated

# ---------------------------------------------------------------------------
# Minecraft
# ---------------------------------------------------------------------------
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
java_version=25

# ---------------------------------------------------------------------------
# Build toolchain
# ---------------------------------------------------------------------------
neoform_version=26.2-2
fabric_loom_version=1.17.20
moddevgradle_version=2.0.147
forgegradle_version=7.0.40

# ---------------------------------------------------------------------------
# Loaders
# ---------------------------------------------------------------------------
fabric_loader_version=0.19.5
fabric_api_version=0.159.0+26.2
quilt_loader_version=0.31.0-beta.4
neoforge_version=26.2.0.87
forge_version=26.2-65.1.3

# ---------------------------------------------------------------------------
# Compile-only dependencies
# ---------------------------------------------------------------------------
mixin_version=0.8.7
modmenu_version=20.0.2

# ---------------------------------------------------------------------------
# Mod metadata version ranges
# "javafml_*" is the FML *language provider* version (what mods.toml calls
# loaderVersion), which is unrelated to the NeoForge/Forge version itself.
# ---------------------------------------------------------------------------
javafml_neoforge_range=[3,)
javafml_forge_range=[24,)
neoforge_version_range=[26.2,)
forge_version_range=[65,)


# ForgeGradle 7: merge the main source set's class and resource outputs into one
# module for dev runs. Without this they resolve as two JPMS modules ("main" and
# "reactivemusic") that both contain the mod's packages, and the client dies with
# a split-package ResolutionException before launch.
net.minecraftforge.gradle.merge-source-sets=true

# Mixin compatibility level. Fabric/Quilt/NeoForge run Fabric's sponge-mixin fork,
# which knows up to JAVA_25; Forge ships upstream Mixin 0.8.7, whose enum stops at
# JAVA_21 and hard-fails on anything it does not recognise. The level only declares
# which Java language features Mixin should assume inside mixin classes, so the lower
# value costs nothing here.
mixin_compat=JAVA_25
mixin_compat_forge=JAVA_21

# Resource-pack format for this Minecraft version (version.json pack_version.resource_*).
# Forge does not generate pack metadata for mods, so its jar ships a pack.mcmeta;
# NeoForge synthesises its own and must not be given one.
resource_format_major=88
resource_format_minor=0
